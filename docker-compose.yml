services:

  mysql:
    image: mysql:8.4

    container_name: jpa-mysql

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: dockerfile

    container_name: spring-data-jpa-mapping

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "8899:8899"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mysql_data: